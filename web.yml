- name: Set up a web server
  hosts: web
  become: true
  tasks:
    - name: Install Apache
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Put a test page in place
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Deployed by Ansible to {{ inventory_hostname }}</h1>\n"

    - name: Start Apache now and at boot
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Open port 80 in the firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
